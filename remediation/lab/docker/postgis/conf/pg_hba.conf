# =====================================================================
# SIG-TEC — reglas de autenticación (común a los seis nodos)
# Orden: la primera regla que coincide se aplica.
# =====================================================================
# TYPE  DATABASE        USER            ADDRESS         METHOD

# Mantenimiento dentro del contenedor (docker compose exec -u postgres ...)
local   all             postgres                        peer
local   all             all                             scram-sha-256

# Respaldo físico (pg_basebackup) solo con el rol de respaldo.
# Las suscripciones lógicas del Integrante 2 NO usan estas líneas: se autentican
# con la regla "host all ..." porque se conectan a una base de datos concreta.
host    replication     sigtec_backup   all             scram-sha-256
host    replication     all             all             reject

# Conexiones TCP: red Docker interna (entre nodos) y puertos publicados
# en 127.0.0.1 (QGIS y herramientas del host). Siempre con contraseña SCRAM.
host    all             all             all             scram-sha-256
