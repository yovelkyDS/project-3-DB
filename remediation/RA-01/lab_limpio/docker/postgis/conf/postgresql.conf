# =====================================================================
# SIG-TEC — configuración común de los seis nodos PostgreSQL 17
# Se usa con:  postgres -c config_file=/etc/postgresql/postgresql.conf
# Los valores propios de cada nodo (cluster_name) se pasan con -c en compose.yaml.
# =====================================================================

# --- Conexiones ------------------------------------------------------
listen_addresses = '*'          # dentro del contenedor; la exposición al host la limita compose (127.0.0.1)
port = 5432
max_connections = 100
superuser_reserved_connections = 3
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

# TLS con certificado autofirmado de desarrollo (lo genera sigtec-entrypoint).
# Los clientes con sslmode=prefer (QGIS, libpq, suscripciones) cifran el tráfico.
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# --- Memoria (seis nodos en una sola máquina de desarrollo) ----------
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# --- WAL y replicación lógica (habilitado para el Integrante 2) ------
wal_level = logical
max_wal_senders = 16
max_replication_slots = 16
max_logical_replication_workers = 8
max_sync_workers_per_subscription = 2
max_worker_processes = 16
max_parallel_workers = 4
wal_sender_timeout = 60s
wal_receiver_timeout = 60s
wal_keep_size = 256MB
max_slot_wal_keep_size = 4GB    # evita que un slot abandonado llene el disco
track_commit_timestamp = on     # marca de tiempo por transacción (auditoría, conflictos y PITR)
wal_compression = on
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_timeout = 5min

# --- Archivado WAL (base del PITR) -----------------------------------
# El destino es un volumen Docker distinto del volumen de datos.
archive_mode = on
archive_command = '/usr/local/bin/sigtec-archive-wal "%p" "%f"'
archive_timeout = 300           # en desarrollo, fuerza un segmento cada 5 min si hubo actividad

# --- Registro ---------------------------------------------------------
logging_collector = off         # stderr -> docker logs
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_replication_commands = on
log_lock_waits = on
log_temp_files = 10MB
log_timezone = 'America/Costa_Rica'

# --- Localización ----------------------------------------------------
timezone = 'America/Costa_Rica'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.spanish'
